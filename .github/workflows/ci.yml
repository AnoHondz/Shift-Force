name: Workforce quality checks
on:
  push:
    branches: [master, codex/workforce-production-readiness]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests scripts migrations config.py gunicorn.conf.py run.py
      - run: python -m ruff format --check app tests scripts migrations config.py gunicorn.conf.py run.py
      - run: python -m pytest -q
      - run: python -m scripts.security_check
      - run: python -m bandit -r app config.py run.py
      - run: python -m pip_audit -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
      - run: python -m scripts.validate_blueprint
      - run: python -m scripts.production_workload --redis-uri redis://127.0.0.1:6379/15 --report artifacts/production-workload.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-workload-evidence
          path: artifacts/production-workload.json
          if-no-files-found: ignore
