<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}Ano Hondz Workforce Ltd{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #ffffff;
  --surface:  #f8f9fa;
  --card:     #ffffff;
  --border:   #e9ecef;
  --accent:   #000000;
  --accent2:  #6c757d;
  --green:    #28a745;
  --yellow:   #ffc107;
  --text:     #000000;
  --muted:    #6c757d;
  --radius:   8px;
  --mono:     'Consolas', 'Monaco', monospace;
  --sans:     'Roboto', 'Segoe UI', sans-serif;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
aside {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 32px 24px;
  display: flex; flex-direction: column; gap: 40px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 40px; height: 40px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; color: #fff; letter-spacing: -1px;
}
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; max-width: 150px; }
.logo-text span { color: var(--accent); }
nav { display: flex; flex-direction: column; gap: 4px; }
.nav-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; padding-left: 12px; }
.nav-btn {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center;
  padding: 10px 12px; border-radius: 8px;
  color: var(--muted); font-family: var(--sans); font-size: 14px; font-weight: 600;
  transition: all .2s; text-align: left; width: 100%; text-decoration: none;
}
.nav-btn:hover { background: var(--card); color: var(--text); }
.nav-btn.active { background: rgba(0,0,0,.1); color: var(--accent); }
.sidebar-footer {
  margin-top: auto;
  padding: 16px 12px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 12px; color: var(--muted); line-height: 1.6;
}
.sidebar-footer strong { color: var(--accent); display: block; margin-bottom: 4px; }
main { padding: 40px 48px; display: flex; flex-direction: column; gap: 32px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
.page-title span { color: var(--accent); }
.page-sub { color: var(--muted); font-size: 14px; margin-top: 4px; font-family: var(--mono); }
#toast {
  position: fixed; bottom: 32px; right: 32px; z-index: 999;
  padding: 14px 20px; border-radius: var(--radius);
  font-size: 14px; font-weight: 600;
  transform: translateY(80px); opacity: 0;
  transition: all .35s cubic-bezier(.34,1.56,.64,1);
  max-width: 320px;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.success { background: rgba(40,167,69,.1); border: 1px solid var(--green); color: var(--green); }
#toast.error   { background: rgba(220,53,69,.1); border: 1px solid #dc3545; color: #dc3545; }
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  position: relative; overflow: hidden;
  transition: transform .2s, border-color .2s;
}
.stat-card:hover { transform: translateY(-2px); border-color: var(--border); }
.stat-card::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(0,0,0,.02);
  pointer-events: none;
}
.stat-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.stat-value { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
.stat-value.accent  { color: var(--accent); }
.stat-value.green   { color: var(--green); }
.stat-value.yellow  { color: var(--yellow); }
.stat-value.accent2 { color: var(--accent2); }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.panel-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.panel-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.search-wrap { position: relative; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.search-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 9px 14px;
  width: 240px;
  outline: none;
  transition: border-color .2s;
}
.search-input:focus { border-color: var(--accent); }
.filter-select {
  min-width: 220px;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 12px 20px; text-align: left;
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
tbody tr { border-bottom: 1px solid rgba(42,42,62,.6); transition: background .15s; }
tbody tr:hover { background: rgba(0,0,0,.05); }
tbody tr:last-child { border-bottom: none; }
td { padding: 14px 20px; font-size: 14px; vertical-align: middle; }
td.mono { font-family: var(--mono); font-size: 13px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; font-family: var(--mono);
}
.badge-id   { background: rgba(0,0,0,.1); color: var(--accent); border: 1px solid rgba(0,0,0,.2); }
.badge-sal  { background: rgba(40,167,69,.1);  color: var(--green);  border: 1px solid rgba(40,167,69,.2); }
.actions { display: flex; gap: 6px; }
.btn-icon {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--muted);
  transition: all .2s;
}
.btn-icon:hover.edit   { border-color: var(--accent); color: var(--accent); background: rgba(0,0,0,.1); }
.btn-icon:hover.delete { border-color: var(--accent2); color: var(--accent2); background: rgba(108,117,125,.1); }
.empty-state {
  padding: 60px 20px; text-align: center; color: var(--muted);
}
.empty-state p { font-size: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; padding: 24px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=email], input[type=number], select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  appearance: none;
}
input:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,0,0,.1);
}
input::placeholder { color: var(--muted); }
.form-actions {
  padding: 0 24px 24px;
  display: flex; gap: 12px; justify-content: flex-end;
}
.btn {
  padding: 10px 20px; border-radius: 8px;
  font-family: var(--sans); font-size: 14px; font-weight: 700;
  cursor: pointer; border: none; transition: all .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary {
  background: var(--accent); color: #fff;
}
.btn-primary:hover { background: #333; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.2); }
.btn-secondary {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger {
  background: rgba(220,53,69,.1); color: #dc3545;
  border: 1px solid rgba(220,53,69,.3);
}
.btn-danger:hover { background: rgba(220,53,69,.2); }
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 480px; max-width: 95vw;
  transform: translateY(20px) scale(.97);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-head {
  padding: 24px 24px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.modal-close {
  width: 32px; height: 32px; border-radius: 8px;
  background: none; border: 1px solid var(--border);
  cursor: pointer; color: var(--muted); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.modal-close:hover { border-color: var(--accent2); color: var(--accent2); }
.confirm-body { padding: 24px; text-align: center; }
.confirm-icon { font-size: 48px; margin-bottom: 12px; }
.confirm-text { color: var(--muted); font-size: 14px; margin: 8px 0 24px; }
.confirm-actions { display: flex; gap: 12px; justify-content: center; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  aside { height: auto; position: relative; padding: 20px; }
  aside nav { flex-direction: row; flex-wrap: wrap; }
  main { padding: 24px 20px; }
  .stats-grid { grid-template-columns: repeat(2,1fr); }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="logo">
      <div class="logo-mark">AH</div>
      <div class="logo-text">Ano <span>Hondz</span><br>Workforce Ltd</div>
    </div>
    <nav>
      <div class="nav-label">Menu</div>
      <a href="{{ url_for('index') }}" class="nav-btn{% if active_page == 'dashboard' %} active{% endif %}">
        Dashboard
      </a>
      <a href="{{ url_for('employees_page') }}" class="nav-btn{% if active_page == 'employees' %} active{% endif %}">
        Employees
      </a>
      <a href="{{ url_for('add_employee_page') }}" class="nav-btn{% if active_page == 'add' %} active{% endif %}">
        Add Employee
      </a>
    </nav>
    <div class="sidebar-footer">
      <strong>Ano Hondz Workforce Ltd</strong>
      Employee management dashboard.<br>Python · MySQL · REST API
    </div>
  </aside>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
<div id="toast"></div>
<script>
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.className = ''; }, 3200);
}
async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return res.json();
}
const fmt = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2 });
function openModal(id) { const el = document.getElementById(id); if (el) el.classList.add('open'); }
function closeModal(id) { const el = document.getElementById(id); if (el) el.classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay.id); });
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
