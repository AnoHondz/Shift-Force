{% extends "base.html" %}
{% block title %}Submit Leave Request{% endblock %}
{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
  <div>
    <h1 class="h3 mb-2">Submit Leave Request</h1>
    <p class="text-muted">Tell your manager why you need time off and when.</p>
  </div>
  <a class="btn btn-outline-secondary" href="{{ url_for('leave.index') }}">Back to Requests</a>
</div>

<div class="card shadow-sm p-4">
  <form method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="request_type">Leave Type</label>
      <select id="request_type" name="request_type" class="form-select" required>
        <option value="">Select a type</option>
        <option>Vacation</option>
        <option>Sick Leave</option>
        <option>Personal Leave</option>
        <option>Remote Work</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label" for="start_date">Start Date</label>
      <input id="start_date" name="start_date" type="date" class="form-control" required />
    </div>
    <div class="col-md-3">
      <label class="form-label" for="end_date">End Date</label>
      <input id="end_date" name="end_date" type="date" class="form-control" required />
    </div>
    <div class="col-12">
      <label class="form-label" for="reason">Reason</label>
      <textarea id="reason" name="reason" rows="4" class="form-control" placeholder="Optional details"></textarea>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Submit Request</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('leave.index') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
