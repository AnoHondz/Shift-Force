{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-5 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-5">
        <h1 class="h4 mb-3">Sign in</h1>
        <p class="text-muted mb-4">Securely access your employee portal and payroll tools.</p>
        <form method="post">
          <input type="hidden" name="next" value="{{ next_url }}" />
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input id="username" name="username" type="text" class="form-control" required />
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>
        <div class="mt-4 text-center">
          <a href="{{ url_for('auth.signup') }}">Create a new account</a>
        </div>
        <div class="mt-3 text-muted small">
          Default admin login: <strong>{{ config.DEFAULT_ADMIN_USERNAME }}</strong> / <strong>{{ config.DEFAULT_ADMIN_PASSWORD }}</strong>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
