{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8 col-lg-9">
    <div class="card shadow-sm">
      <div class="card-body p-5">
        <h1 class="h4 mb-3">Create your account</h1>
        <p class="text-muted mb-4">Employees can register directly. Managers and admins require an invite code.</p>
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="username">Username</label>
              <input id="username" name="username" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="password">Password</label>
              <input id="password" name="password" type="password" class="form-control" minlength="8" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="role">Role</label>
              <select id="role" name="role" class="form-select" onchange="toggleInvite()">
                <option value="employee">Employee</option>
                <option value="manager">Manager</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-md-6" id="invite-field" style="display:none;">
              <label class="form-label" for="invite_code">Invite Code</label>
              <input id="invite_code" name="invite_code" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="first_name">First Name</label>
              <input id="first_name" name="first_name" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="last_name">Last Name</label>
              <input id="last_name" name="last_name" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Email</label>
              <input id="email" name="email" type="email" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="job_title">Position</label>
              <input id="job_title" name="job_title" class="form-control" placeholder="eg. Software Engineer" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="department_id">Department</label>
              <select id="department_id" name="department_id" class="form-select">
                <option value="">Unassigned</option>
                {% for department in departments %}
                  <option value="{{ department.id }}">{{ department.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create Account</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function toggleInvite() {
  const isAdminOrManager = document.getElementById('role').value !== 'employee';
  document.getElementById('invite-field').style.display = isAdminOrManager ? 'block' : 'none';
}
toggleInvite();
</script>
{% endblock %}
